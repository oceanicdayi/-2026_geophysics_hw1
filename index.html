:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131C21; --paper-2:#18242A; --grid:rgba(160,200,215,.06);

}
:root[data-theme="dark"]{
  --paper:#131C21; --paper-2:#18242A; --grid:rgba(160,200,215,.06);
  --ink:#E3ECEF; --ink-2:#AFC0C7; --ink-3:#83959D;
  --trace:#F06A5B; --line:#2C3C44; --card:#1A262C; --chip:#24343B; --focus:#7CC4DD;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.75;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* hero */
header.hero{padding:56px 0 8px}
.course{font-size:.95rem;color:var(--ink-2);margin:0 0 6px}
h1{font-family:var(--kai);font-weight:700;font-size:clamp(2.3rem,6vw,3.9rem);line-height:1.15;margin:0;letter-spacing:.02em}
.lede{max-width:40em;color:var(--ink-2);margin:14px 0 0}
.seis{margin:30px 0 0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 14px 6px;overflow-x:auto}
.seis svg{display:block;width:100%;min-width:760px;height:auto}
.seis .trace{fill:none;stroke:var(--trace);stroke-width:1.6;stroke-linejoin:round}
.seis .base{stroke:var(--line);stroke-width:1}
.seis .tick{stroke:var(--ink-3);stroke-width:1}
.seis a text{font-family:var(--kai);font-size:15px;fill:var(--ink)}
.seis a:hover text,.seis a:focus text{fill:var(--trace)}
.seis a:focus{outline:none}
.seis a:focus-visible rect{stroke:var(--focus);stroke-width:2}
.seis a rect{fill:transparent}
.seis-note{font-size:.82rem;color:var(--ink-3);margin:4px 2px 4px}
@media (prefers-reduced-motion:no-preference){
  .seis .trace{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.6s ease-out .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}

/* filters */
.filters{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:34px;padding:12px 0 10px}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.frow+.frow{margin-top:8px}
.flabel{font-size:.85rem;color:var(--ink-3);min-width:4.5em}
.chip{font:inherit;font-size:.88rem;border:1px solid transparent;background:var(--chip);color:var(--ink);padding:3px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{margin-left:auto;font-size:.85rem;color:var(--ink-3)}
.theme-btn{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:3px 12px;cursor:pointer}

/* entries */
main{padding:10px 0 40px}
.entry{display:grid;grid-template-columns:54px 1fr;gap:0 26px;padding:34px 0;border-bottom:1px solid var(--line)}
.entry[hidden]{display:none}
.core{display:flex;flex-direction:column;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.18);min-height:220px}
.core span{flex:var(--f,1)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.name{font-family:var(--kai);font-size:2rem;font-weight:700;margin:0;line-height:1.2}
.sid{color:var(--ink-3);font-size:.9rem}
.style-tag{font-size:.82rem;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:0 10px}
.site-title{font-family:var(--kai);font-size:1.15rem;color:var(--ink-2);margin:6px 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 32px}
.desc{margin:0;max-width:36em}
.hl{margin:0;padding:0;list-style:none}
.hl li{position:relative;padding-left:18px;margin-bottom:6px;font-size:.95rem;color:var(--ink-2)}
.hl li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:2px;background:var(--trace)}
.foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:.8rem;background:var(--chip);border-radius:4px;padding:1px 8px;color:var(--ink-2)}
.fonts{font-size:.82rem;color:var(--ink-3)}
.open{margin-left:auto;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;font-size:.95rem;background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:6px}
.open:hover{background:var(--trace)}
.nolink{margin-left:auto;font-size:.88rem;color:var(--ink-3);border:1px dashed var(--line);padding:6px 12px;border-radius:6px}
.empty{padding:40px 0;color:var(--ink-2)}
footer{padding:26px 0 48px;color:var(--ink-3);font-size:.85rem}

@media (max-width:760px){
  .entry{grid-template-columns:1fr;gap:16px}
  .core{flex-direction:row;min-height:0;height:18px}
  .cols{grid-template-columns:1fr}
  .open,.nolink{margin-left:0}
  .count{margin-left:0;width:100%}
}
</style>

  hl:["小組「黃金鐵三角」角色分工說明","互動式裝備檢核表與 18 週探險地圖","以「日本東側震源為何往內陸越來越深」當探究範例"],
  feats:["打勾清單"],fonts:"Zen Maru Gothic、Quicksand、Noto Serif TC"}
];

const STYLES=["全部","紙本手感","深色科技","明亮活潑","主題創意","簡潔典雅"];
const FEATS=["不限","語音朗讀","中英切換","測驗","打勾清單","計算機","深淺色切換"];
let curStyle="全部", curFeat="不限";

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const list=document.getElementById("list");
  list.innerHTML=S.map(s=>{
    const layers=s.colors.map((c,i)=>`<span style="background:${c};--f:${[3,2,1.4,2.4,1,1.8,1.2][i%7]}"></span>`).join("");
    const feats=(s.feats.length?s.feats:["純靜態頁面"]).map(f=>`<span class="feat">${esc(f)}</span>`).join("");
    const link=s.url?`<a class="open" href="${s.url}" target="_blank" rel="noopener">開啟網頁</a>`:`<span class="nolink">${esc(s.note)}</span>`;
    return `<article class="entry" id="${s.id}" data-style="${s.style}" data-feats="${s.feats.join(",")}">
      <div class="core" aria-hidden="true">${layers}</div>
      <div>
        <div class="head"><h2 class="name">${esc(s.name)}</h2><span class="sid">${s.id}</span><span class="style-tag">${esc(s.style)}</span></div>
        <p class="site-title">〈${esc(s.title)}〉</p>
        <div class="cols">
          <p class="desc">${esc(s.desc)}</p>
          <ul class="hl">${s.hl.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>
        </div>
        <div class="foot"><div class="feats">${feats}</div><span class="fonts">字體：${esc(s.fonts)}</span>${link}</div>
      </div></article>`;
  }).join("")+`<p class="empty" id="empty" hidden>目前沒有同時符合這兩個條件的作品，換一個風格或功能試試看。</p>`;
}

function chips(rowId,items,get,set){
  const row=document.getElementById(rowId);
  const anchor=row.querySelector(".count");
  items.forEach(t=>{
    const b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=t;
    b.setAttribute("aria-pressed",String(get()===t));
    b.onclick=()=>{set(t);row.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.textContent===t)));apply();};
    row.insertBefore(b,anchor);
  });
}

function apply(){
  let n=0;
  document.querySelectorAll(".entry").forEach(el=>{
    const ok=(curStyle==="全部"||el.dataset.style===curStyle)&&(curFeat==="不限"||el.dataset.feats.split(",").includes(curFeat));
    el.hidden=!ok; if(ok)n++;
  });
  document.getElementById("empty").hidden=n>0;
  document.getElementById("count").textContent=`顯示 ${n} / ${S.length} 件作品`;
}

function seismo(){
  const svg=document.getElementById("seis"), W=1000, base=80, seg=W/S.length, maxKb=Math.max(...S.map(s=>s.kb));
  let d=`M0 ${base}`, marks="";
  S.forEach((s,i)=>{
    const x0=i*seg, amp=6+ (s.kb/maxKb)*62, steps=26;
    for(let k=1;k<=steps;k++){
      const t=k/steps, x=x0+t*seg;
      const env=Math.sin(Math.PI*t)**1.6;
      const y=base+Math.sin(t*Math.PI*(9+(i%4)))*amp*env*((k%2)?1:-.85);
      d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    const cx=x0+seg/2;
    marks+=`<line class="tick" x1="${cx}" y1="152" x2="${cx}" y2="160"/>
      <a href="#${s.id}" aria-label="跳到${s.name}的作品"><rect x="${x0+2}" y="${base-72}" width="${seg-4}" height="175" rx="4"/>
      <text x="${cx}" y="180" text-anchor="middle">${s.name}</text></a>`;
  });
  svg.innerHTML=`<line class="base" x1="0" y1="${base}" x2="${W}" y2="${base}"/><path class="trace" d="${d}"/>${marks}`;
  const p=svg.querySelector(".trace"); p.style.setProperty("--len",Math.ceil(p.getTotalLength()));
}

document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}
};
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}

render();
chips("styleRow",STYLES,()=>curStyle,v=>curStyle=v);
chips("featRow",FEATS,()=>curFeat,v=>curFeat=v);
apply(); seismo();
</script>
</body>
</html>
